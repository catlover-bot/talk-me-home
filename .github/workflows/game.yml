name: Game checks
on: [push, pull_request]
jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-1280, chromium-1440]
        shard: ['1/2', '2/2']
    env:
      GAME_DISABLE_LIVE: '1'
      # Ubuntu's AppArmor profile permits the runner's installed Chrome sandbox.
      # Downloaded Chromium headless-shell is not covered by that profile.
      GAME_QA_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 2
      - run: npm run build:game
      - run: npx playwright install-deps chromium
      - name: Verify the installed sandbox-compatible browser
        run: |
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
      - run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        timeout-minutes: 4
